template: docker_cpu
on: apps.cpu
lookup: usage
units: %
every: 30s          # matches docker plugin
warn: $this > 80
crit: $this > 90
info: "Docker container CPU usage high: ${this}%"
-to: sysadmin
rearm: 1m

template: docker_io
on: docker.io
lookup: write_ops
units: ops/s
every: 60s
warn: $this < (avar(5m, $this) * 0.7)
crit: $this < (avar(5m, $this) * 0.5)
info: "Docker I/O reduced compared to baseline"
-to: sysadmin
rearm: 10m