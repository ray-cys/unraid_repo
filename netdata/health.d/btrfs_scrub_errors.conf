template: btrfs_scrub_errors
on: btrfs.scrub
lookup: errors
units: errors
every: 300s
warn: $this > 0
crit: $this > 5
info: "BTRFS scrub reported errors"
-to: sysadmin
rearm: 1h

template: btrfs_pool_full
on: btrfs.space
lookup: used
units: %
every: 300s
warn: $this > 80
crit: $this > 95
info: "BTRFS pool nearly full"
-to: sysadmin
rearm: 30m