template: cpu_iGPU_overload
on: system.cpu
lookup: usage
units: %
every: 30s          # matches CPU plugin
warn: $this > 80
crit: $this > 90
info: "CPU usage high: ${this}%"
-to: sysadmin
rearm: 1m

template: intel_iGPU_temp
on: sensors.temp
lookup: temperature
units: °C
every: 30s          # matches iGPU plugin
warn: $this > 75
crit: $this > 85
info: "Intel iGPU temperature high: ${this}°C"
-to: sysadmin
rearm: 1m