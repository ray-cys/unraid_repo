template: net_drop
on: net
lookup: errors_out
units: packets
every: 60s
warn: $this > 0
crit: $this > 5
info: "Network interface sending errors"
-to: sysadmin
rearm: 5m

template: net_drop_in
on: net
lookup: errors_in
units: packets
every: 60s
warn: $this > 0
crit: $this > 5
info: "Network interface receiving errors"
-to: sysadmin
rearm: 5m