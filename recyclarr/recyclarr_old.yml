# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/master/schemas/config-schema.json

# Config to use with Recyclarr.
# Required to update the `api_key` and `base_url` for each instance.
#
# To use pre-built configuration instead of building from scratch, see these pages:
# - Config Templates: https://recyclarr.dev/wiki/guide-configs/
# - CLI Command: https://recyclarr.dev/wiki/cli/config/list/templates/
#
# For more details on the configuration, see the Configuration Reference on the wiki here:
# https://recyclarr.dev/wiki/yaml/config-reference/

sonarr:
  sonarr:
    base_url: !secret sonarr_url
    api_key: !secret sonarr_apikey
    
    quality_definition:
      type: series

    quality_profiles:
      - trash_id: 9d142234e45d6143785ac55f5a9e8dc9
        reset_unmatched_scores:
          enabled: true
      - trash_id: dfa5eaae7894077ad6449169b6eb03e0
        reset_unmatched_scores:
          enabled: true
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f
        reset_unmatched_scores:
          enabled: true
    
    # Manual Profile Configuration
      - name: Bluray-2160p Remux
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-2160p Remux
          until_score: 10000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: Bluray-2160p Remux
          - name: Bluray-2160p
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray-1080p
          - name: HDTV-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
    
    # Custom Format Configuration
    delete_old_custom_formats: true
    custom_formats:
      # HQ Source Groups
      - trash_ids: [c2216b7b8aa545dc1ce8388c618f8d57] # HD Bluray Tier 02
        assign_scores_to:
          - name: Bluray-2160p Remux
            score: 1750
      - trash_ids: [d6819cba26b1a6508138d25fb5e32293] # HD Bluray Tier 01
        assign_scores_to:
          - name: Bluray-2160p Remux
            score: 1800 
      - trash_ids: [8a1d0c3d7497e741736761a1da866a2e] # Remux Tier 02
        assign_scores_to:
          - name: Bluray-2160p Remux
            score: 1850
      - trash_ids: [9965a052eb87b0d10313b1cea89eb451] # Remux Tier 01
        assign_scores_to:
          - name: Bluray-2160p Remux
            score: 1900
    
      # Optional
      - trash_ids:
           - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
           - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
           - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
           - 06d66ab109d4d2eddb2794d21526d140 # Retags
           - 1b3994c551cbb92a2c781af061f4ab44 # Scene
        assign_scores_to:
          - name: WEB-1080p
          - name: WEB-2160p
          - name: Bluray-2160p Remux

      - trash_ids:
          # Comment out the next line if you and all of your users' setups are fully DV compatible
          # - 9b27ab6498ec0f31a3353992e19434ca # DV (WEBDL)

          # HDR10+ Boost - Uncomment the next two lines if any of your devices DO support HDR10+
           - 0c4b99df9206d2cfac3c05ab897dd62a # HDR10+ Boost
           - 7c3a61a9c6cb04f52f1544be6d44a026 # DV Boost
        assign_scores_to:
          - name: WEB-2160p
          - name: Bluray-2160p Remux

      - trash_ids:
          # Uncomment the next six lines to allow x265 HD releases with HDR/DV
           - 47435ece6b99a0b477caf360e79ba0bb # x265 (HD)
        assign_scores_to:
           - name: WEB-2160p
             score: 0
           - name: Bluray-2160p Remux

      - trash_ids:
           - 9b64dff695c2115facf1b6ea59c9bd07 # x265 (no HDR/DV)
        assign_scores_to:
          - name: WEB-2160p
          - name: Bluray-2160p Remux

      # Optional SDR
      # Only ever use ONE of the following custom formats:
      # SDR - block ALL SDR releases
      # SDR (no WEBDL) - block UHD/4k Remux and Bluray encode SDR releases, but allow SDR WEB
      - trash_ids:
          - 2016d1676f5ee13a5b7257ff86ac9a93 # SDR
          # - 83304f261cf516bb208c18c54c0adf97 # SDR (no WEBDL)
        assign_scores_to:
          - name: WEB-2160p
          - name: Bluray-2160p Remux
    
      # Anime Custom Format Configuration
      - trash_ids:
          - 026d5aadd1a6b4e550b134cb6c72b3ca # Uncensored
        assign_scores_to:
          - name: Remux-1080p - Anime
            score: 101

      - trash_ids:
          - b2550eb333d27b75833e25b8c2557b38 # 10bit
        assign_scores_to:
          - name: Remux-1080p - Anime
            score: 0

      - trash_ids:
          - 418f50b10f1907201b6cfdf881f467b7 # Anime Dual Audio
        assign_scores_to:
          - name: Remux-1080p - Anime
            score: 2000
            
