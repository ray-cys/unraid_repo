# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/master/schemas/config-schema.json

# Config to use with Recyclarr.
# Required to update the `api_key` and `base_url` for each instance.
#
# To use pre-built configuration instead of building from scratch, see these pages:
# - Config Templates: https://recyclarr.dev/wiki/guide-configs/
# - CLI Command: https://recyclarr.dev/wiki/cli/config/list/templates/
#
# For more details on the configuration, see the Configuration Reference on the wiki here:
# https://recyclarr.dev/wiki/yaml/config-reference/

sonarr:
  sonarr:
    base_url: !secret sonarr_url
    api_key: !secret sonarr_apikey
    
    quality_definition:
      type: series

    quality_profiles:
      - trash_id: 9d142234e45d6143785ac55f5a9e8dc9 # WEB-1080p (Alternative)
        reset_unmatched_scores:
          enabled: true
      - trash_id: dfa5eaae7894077ad6449169b6eb03e0 # WEB-2160p (Alternative)
        reset_unmatched_scores:
          enabled: true
    
    # Custom Format Groups Configuration
    delete_old_custom_formats: true
    custom_format_groups:
      add:
      - trash_id: f4a0410a1df109a66d6e47dcadcce014 # Miscellaneous
        select:
           - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
           - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
           - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
           - 06d66ab109d4d2eddb2794d21526d140 # Retags
           - 1b3994c551cbb92a2c781af061f4ab44 # Scene
      - trash_id: 9b64dff695c2115facf1b6ea59c9bd07 # x265 (no HDR/DV)
        assign_scores_to:
          - name: WEB-2160p
      - trash_id: 2016d1676f5ee13a5b7257ff86ac9a93 # SDR
        assign_scores_to:
          - name: WEB-2160p
            
radarr:
  radarr:
    base_url: !secret radarr_url
    api_key: !secret radarr_apikey
    
    quality_definition:
      type: movie
      
    quality_profiles:
      - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
        reset_unmatched_scores:
            enabled: true
      - trash_id: 9ca12ea80aa55ef916e3751f4b874151 # Remux + WEB 1080p
        reset_unmatched_scores:
            enabled: true
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f # UHD Bluray + WEB  
        reset_unmatched_scores:
            enabled: true
      - trash_id: fd161a61e3ab826d3a22d53f935696dd # Remux + WEB 2160p
        reset_unmatched_scores:
            enabled: true
      - trash_id: d1d310673359205736b4b84acd5ea8c8 # Remux 2160p (Combined)

    # Custom Format Groups Configuration
    delete_old_custom_formats: true
    custom_format_groups:
      add:
      - trash_id: 9337080378236ce4c0b183e35790d2a7 # Miscellaneous
        select:
           - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
           - cc444569854e9de0b084ab2b8b1532b2 # Black and White Editions
           - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No-RlsGroup
           - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
           - 5c44f52a8714fdd79bb4d98e2673be1f # Retags
           - f537cf427b64c38c8e36298f657e4828 # Scene
      - trash_id: f4f1474b963b24cf983455743aa9906c # Movie Versions
        select:
           - eca37840c13c6ef2dd0262b141a5482f # 4K Remaster
           - e0c07d59beb37348e975a930d5e50319 # Criterion Collection
           - 0f12c086e289cf966fa5948eac571f44 # Hybrid
           - eecf3a857724171f968a66cb5719e152 # IMAX
           - 9f6cbff8cfe4ebbc1bde14c7b7bec0de # IMAX Enhanced
           - 9d27d9d2181838f76dee150882bdc58c # Masters of Cinema
           - 09d9dd29a0fc958f9796e65c2a8864b4 # Open Matte
           - 570bc9ebecd92723d2d21500f4be314c # Remaster
           - 957d0f44b592285f26449575e8b1167e # Special Edition
           - e9001909a4c88013a359d0b9920d7bea # Theatrical Cut
           - db9b4c4b53d312a3ca5f1378f6440fc9 # Vinegar Syndrome
      - trash_id: dc98083864ea246d05a42df0d05f81cc # # x265 (HD)
      - trash_id: 9c38ebb7384dada637be8899efa68e6f # SDR



