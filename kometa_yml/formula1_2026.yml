  Formula 1 (2026):
    title: "Formula 1 (2026)"
    sort_title: "Formula 1 (2026)"
    original_title: "Formula Internationale"
    originally_available: "1950-05-13"
    content_rating: "PG-13"
    studio: "F1TV"
    tagline: "We race as one."
    summary: |-
            Formula One (also Formula 1 or F1 and officially the FIA Formula One World Championship) is the highest class of single-seat auto racing that is sanctioned by the Fédération Internationale de l'Automobile (FIA).
            The FIA Formula One World Championship has been the premier form of racing since the inaugural season in 1950.
            The F1 season consists of a series of races, known as Grands Prix, held worldwide on purpose-built F1 circuits and public roads.
    genre:
        - Sport
        - Action
        - Comedy
        - Drama
        - Thriller
