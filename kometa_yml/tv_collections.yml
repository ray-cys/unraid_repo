  ## TMDb On The Air
  TMDb On The Air:
    tmdb_on_the_air: 30
    collection_order: custom  
    sync_mode: sync
    file_poster: config/assets/collection/TMDb-On-The-Air.jpg
    summary: >-
            A collection of shows that are still actively airing episodes.
    content_rating: TV-MA
    sort_title: +
      
  ## TMDb Airing Today
  TMDb Airing Today:
    tmdb_airing_today: 100
    collection_order: custom
    sync_mode: sync
    file_poster: config/assets/collection/TMDb-Airing-Today.jpg
    summary: >-
            A collection of shows with episodes airing today.
    content_rating: TV-MA
    sort_title: +
    
  ## TMDb Apple TV+
  Apple TV+:
    schedule: weekly(wednesday|saturday)
    tmdb_network: 2552
    filters:
      genre.not: Animation, Family, Reality
    file_poster: config/assets/collection/Apple-TV+.jpg
    summary: >-
            A collection of Apple TV shows.
    content_rating: TV-MA
    sort_title: +2

